<svg fill="none" viewBox="0 0 800 120" width="800" height="120" xmlns="http://www.w3.org/2000/svg">

<foreignObject width="100%" height="100%">

<div xmlns="http://www.w3.org/1999/xhtml">

<style>

@keyframes gradientText {

0% {
background-position: 0% 50%;
}

50% {
background-position: 100% 50%;
}

100% {
background-position: 0% 50%;
}

}


h1 {

font-family:
'Inter',
-apple-system,
BlinkMacSystemFont,
'Segoe UI',
Roboto,
Ubuntu,
sans-serif;

margin:0;

font-size:5em;

font-weight:900;

letter-spacing:-0.05em;

text-align:center;


/* Neon Developer Gradient */

background:
linear-gradient(
270deg,
#58A6FF,
#7C3AED,
#00D9FF,
#58A6FF
);


background-size:300% 300%;


background-clip:text;

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;


animation:
gradientText 5s ease infinite;


}



.snowflake {


position:fixed;

top:-10%;

color:#ffffff;

font-size:18px;

font-family:Arial;

text-shadow:
0 0 8px #58A6FF;


z-index:9999;

user-select:none;


animation:
snowFall 10s linear infinite,
snowMove 3s ease-in-out infinite;

}



@keyframes snowFall {

0% {

top:-10%;

}

100% {

top:110%;

}

}



@keyframes snowMove {

0% {

transform:translateX(0px);

}


50% {

transform:translateX(60px);

}


100% {

transform:translateX(0px);

}

}



.snowflake:nth-child(2){

left:10%;

animation-delay:1s;

}


.snowflake:nth-child(3){

left:25%;

animation-delay:3s;

}


.snowflake:nth-child(4){

left:40%;

animation-delay:5s;

}


.snowflake:nth-child(5){

left:55%;

animation-delay:2s;

}


.snowflake:nth-child(6){

left:70%;

animation-delay:6s;

}


.snowflake:nth-child(7){

left:85%;

animation-delay:4s;

}


</style>



<h1>
KASHI TECH
</h1>


<div class="snowflake">
❅
</div>


<div class="snowflake">
❅
</div>


<div class="snowflake">
❅
</div>


<div class="snowflake">
❅
</div>


<div class="snowflake">
❅
</div>


<div class="snowflake">
❅
</div>


<div class="snowflake">
❅
</div>


</div>


</foreignObject>


</svg>